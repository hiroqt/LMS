name: Client CI

on:
  pull_request:
    paths: ["client/**", ".github/workflows/client-ci.yml"]
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client-ci.yml"]

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  checks:
    name: Lint, types, unit, build, memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Generated UI memory is up to date
        run: npm run memory:check

  e2e:
    name: Flow parity (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Flow parity on the dev server
        run: npm run test:e2e
      - name: Flow parity on the production build
        run: npm run test:e2e
        env:
          E2E_PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  memory-reminder:
    name: UI memory reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn when shared UI code changes without a memory update
        working-directory: .
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^client/src/(app|shared|features)/' && \
             ! echo "$changed" | grep -qE '^client/docs/ui-memory/(DECISIONS|LEARNINGS|CONVENTIONS|FLOW_PARITY)\.md$'; then
            echo "::warning title=UI memory::This PR changes client/src/{app,shared,features} but no docs/ui-memory entry. If it taught you something or set a rule, add a LEARNINGS or DECISIONS entry (see client/docs/ui-memory/README.md)."
          else
            echo "UI memory looks considered."
          fi
