name: Client CI

on:
  pull_request:
    paths: ["client/**", "server/**", ".github/workflows/client-ci.yml"]
  push:
    branches: [main]
    paths: ["client/**", "server/**", ".github/workflows/client-ci.yml"]

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  checks:
    name: Lint, types, unit, build, memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: No disallowed decoration (C-019)
        run: npm run style:check
      - run: npm run test:unit
      - run: npm run build
      - name: Performance budget
        run: npm run budget
      - name: Generated UI memory is up to date
        run: npm run memory:check
      - name: API demo seed matches data.js
        run: npm run demo-seed:check

  e2e:
    name: Flow parity (Playwright)
    runs-on: ubuntu-latest
    # Class meetings (D-070) join a real LiveKit media server, set up like meet-server/: one UDP
    # port, and it tells the browsers to send media to 127.0.0.1. CI-only key and secret.
    services:
      livekit:
        image: livekit/livekit-server:v1.13.11
        env:
          LIVEKIT_KEYS: "lms-ci: ci_only_livekit_secret_0123456789abcdef"
          NODE_IP: 127.0.0.1
          LIVEKIT_CONFIG: |
            rtc:
              tcp_port: 7881
              udp_port: 7882
              use_external_ip: false
            room:
              auto_create: false
        ports:
          - 7880:7880
          - 7881:7881
          - 7882:7882/udp
    env:
      E2E_LIVEKIT_URL: ws://127.0.0.1:7880
      E2E_LIVEKIT_KEY: lms-ci
      E2E_LIVEKIT_SECRET: ci_only_livekit_secret_0123456789abcdef
      # A missing media server fails the meeting specs instead of skipping them.
      E2E_REQUIRE_LIVEKIT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The suite starts the LMS API in Demo mode (fictional seed, SQLite per test; D-032).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build the LMS API
        run: dotnet build ../server/src/Lms.Api
      - run: npx playwright install --with-deps chromium webkit
      - name: Flow parity on the dev server
        run: npm run test:e2e
      - name: Flow parity on the production build
        run: npm run test:e2e
        env:
          E2E_PREVIEW: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  memory-reminder:
    name: UI memory reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn when shared UI code changes without a memory update
        working-directory: .
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^client/src/(app|shared|features)/' && \
             ! echo "$changed" | grep -qE '^client/docs/ui-memory/(DECISIONS|LEARNINGS|CONVENTIONS|FLOW_PARITY)\.md$'; then
            echo "::warning title=UI memory::This PR changes client/src/{app,shared,features} but no docs/ui-memory entry. If it taught you something or set a rule, add a LEARNINGS or DECISIONS entry (see client/docs/ui-memory/README.md)."
          else
            echo "UI memory looks considered."
          fi
